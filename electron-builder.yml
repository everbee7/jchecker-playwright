appId: com.everbee7.jobchecker
productName: JobChecker
asar: false
npmRebuild: false
compression: normal
electronDist: node_modules/electron/dist
directories:
  output: dist-electron
files:
  - desktop-dist/**/*
  - desktop/config.html
  - .next/**/*
  - "!.next/cache/**/*"
  - app/**/*
  - components/**/*
  - lib/**/*
  - types/**/*
  - package.json
  - next.config.ts
extraResources:
  - from: desktop-browsers
    to: playwright-browsers
    filter:
      - "**/*"
      - "!chromium-*/**/*"
extraFiles:
  - from: .env.example
    to: JobChecker.env.example
win:
  icon: desktop/icon.png
  target:
    - target: portable
      arch:
        - x64
  artifactName: JobChecker-${version}-portable.${ext}
portable:
  artifactName: JobChecker-${version}-portable.${ext}
  requestExecutionLevel: user
